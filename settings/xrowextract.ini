# "Orphaned/unused" via XrowExtractRelation's 'unrelated' mode: no other object relates to it at all (no
# object-relation attribute, relation-list attribute, or embedded ezxmltext/ezxmltags link points to it).
[Preset_orphaned_images]
Name=Orphaned/unused images
Description=Images that nothing on the site links to, embeds, or relates to.
Audience=Maintenance
View=csv
Definition={"scope":"tree","subtree":"2","class_identifier":"image","sort_field":"name","sort_ascending":true,"filters":{"extended_filter":"XrowExtractRelation","extended_params":"{\"unrelated\":true}"}}

[Preset_orphaned_files]
Name=Orphaned/unused files
Description=Files that nothing on the site links to, embeds, or relates to.
Audience=Maintenance
View=csv
Definition={"scope":"tree","subtree":"2","class_identifier":"file","sort_field":"name","sort_ascending":true,"filters":{"extended_filter":"XrowExtractRelation","extended_params":"{\"unrelated\":true}"}}

[Preset_seo_titles_and_urls]
Name=SEO: titles and URLs
Description=A class you choose, A to Z — apply the "urls" column set after loading to keep only the title and URL columns.
Audience=Maintenance
View=csv
Definition={"scope":"tree","subtree":"2","class_identifier":"{class}","sort_field":"name","sort_ascending":true}
Placeholders={"class":{"default":"ng_article"}}

