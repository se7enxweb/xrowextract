#?ini charset="utf-8"?
# Exponential xrowextract configuration file: saved export presets.
#
# A preset is a complete, named CSV export definition (scope, node, class, columns, languages, every
# filter, sort, output format) an admin ships with the extension, read only from the view. A person's own
# presets are created and edited from the view itself and are not kept here.
#
# [Preset_<id>]
# Name=            # shown in the picker
# Description=     # shown next to it
# View=csv         # csv (the only view presets support so far)
# Extends=         # "alias:<fetchalias.ini name>[:<siteaccess>]", or, once user presets exist, "user:<id>"
# Definition=      # one JSON object: the fields XrowExtractPreset::resolve() reads — scope, subtree,
#                  #   subtree_remote_id, class_id, class_identifier, mainnodeonly, limit, offset,
#                  #   languages, attributes, filters (an XrowExtractFilters values array), sort_field,
#                  #   sort_ascending, sort_field2, sort_ascending2, output_format, separator,
#                  #   line_separator, escape. A string value may hold a {name} placeholder.
# Placeholders=    # one JSON object: {"name": {"default": "..."}}, one entry per {name} used above

# Every object hidden below a chosen node ({node}, default the site root), newest changes first.
[Preset_hidden_content]
Name=Hidden content
Description=Everything hidden below the chosen node, newest changes first.
View=csv
Definition={"scope":"tree","subtree":"{node}","sort_field":"modified","sort_ascending":false,"filters":{"visibility":"hidden"}}
Placeholders={"node":{"default":"2"}}

# Extends the xrowextract_recent_content named fetch (extension/xrowextract/settings/fetchalias.ini.append.php):
# its node and limit, this preset's own class (a placeholder — fill it in when loading or running).
[Preset_recent_by_class]
Name=Recent content of a class
Description=The newest objects of a class you choose, below a node you choose (extends the xrowextract_recent_content named fetch).
View=csv
Extends=alias:xrowextract_recent_content
Definition={"class_identifier":"{class}"}
Placeholders={"node":{"default":"2"},"limit":{"default":"10"},"class":{"default":""}}

# Scheduled exports and imports (xrowextract/schedules). The cronjob part "xrowextract"
# (php runcronjobs.php xrowextract) starts the due ones; a finished job's files are kept as long as
# csv.ini [Jobs] RetentionDays says (a schedule can keep its own longer or shorter).
[Schedules]
# The crontab line the Schedules page shows for the cronjob part runs it every this many minutes.
CronjobEveryMinutes=5

# The export history (xrowextract/history): one row per run, kept this many days unless a schedule
# says otherwise. The cronjob part removes older rows.
[History]
RetentionDays=365
# Rows per page on the History page.
PageSize=25

# Delivery destinations (xrowextract/destinations).
[Destinations]
# The only folders a "Local or NAS folder" destination may write into, and a scheduled import may read
# from (absolute, or relative to the installation root). Empty: no local folder at all.
# LocalPathRoots[]=/mnt/nas/exports
LocalPathRoots[]
# A delivery is tried this many times, waiting BackoffSeconds, then twice as long, ... in between.
MaxAttempts=3
BackoffSeconds=10
# Where the OpenSSH client (sftp, ssh-keyscan, ssh-keygen) is, when not in /usr/bin or /usr/local/bin.
SshBinaryDir=

# Destination passwords and keys are stored encrypted (libsodium secretbox). The key is in this file,
# generated with 0600 on first use; set it in settings/override. Relative: to the installation root.
# Losing it makes the stored secrets unreadable (enter them again); never commit it.
[Secrets]
KeyFile=settings/override/xrowextract-secrets.key

[Notifications]
# When set, a schedule's webhook is signed: X-Xrowextract-Signature: sha256=<HMAC-SHA256 of
# "<X-Xrowextract-Timestamp>.<sha256 of the body>"> with this key. Set it in settings/override.
WebhookSecret=
